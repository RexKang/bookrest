<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾书 Bookrest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-name">拾书 <span class="muted">Bookrest</span></span>
      <span class="ver" id="ver" title="版本号">v—</span>
    </div>

    <div class="side-block">
      <div class="side-title">库</div>
      <div id="libList" class="lib-list"></div>
      <div class="btn-row">
        <button id="btnAddLib" class="ghost small">＋ 添加库目录</button>
        <button id="btnDiscover" class="ghost small" title="在整块磁盘上找书，生成候选库列表">全盘找书</button>
      </div>
    </div>

    <div class="side-block grow">
      <div class="side-title">书架</div>
      <div id="shelfList" class="shelf-list"></div>
      <button id="btnNewShelf" class="ghost small">＋ 新建书架</button>
    </div>

    <div class="side-block">
      <div class="side-title">过滤</div>
      <div id="filters" class="filters"></div>
    </div>

    <div class="side-actions">
      <button id="btnScan" class="primary" title="只读扫描：更新索引与封面缓存，不导入、不移动、不修改任何文件">重新扫描</button>
      <div class="hint" id="scanHint">扫描 = 只读更新索引，不动你的文件</div>
    </div>
  </aside>

  <main>
    <header id="topbar">
      <div class="views" id="viewTabs">
        <button data-view="shelf" class="on">书架视图</button>
        <button data-view="wall">封面墙</button>
        <button data-view="report">体检报告</button>
      </div>
      <input id="search" placeholder="搜索 标题 / 系列 / 作者 / 路径">
      <select id="sortBy">
        <option value="series">按系列排序</option>
        <option value="title">按标题排序</option>
        <option value="recent">按加入时间</option>
      </select>
      <span id="stats" class="muted"></span>
      <button id="btnSettings" class="gear" title="设置" aria-label="设置">⚙</button>
    </header>

    <div id="offline" class="banner hidden"></div>
    <div id="scanbar" class="scanbar hidden"><span class="spin"></span><span id="scanText">扫描中…</span></div>

    <section id="content" class="content"></section>
  </main>

  <aside id="detail" class="drawer"></aside>
  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="app.js"></script>
</body>
</html>
